<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (safe for maskable icons) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Pins: 4 per side, drawn under the chip body -->
  <g fill="#e0e7ff">
    <!-- top -->
    <rect x="172" y="118" width="24" height="52" rx="8"/>
    <rect x="228" y="118" width="24" height="52" rx="8"/>
    <rect x="284" y="118" width="24" height="52" rx="8"/>
    <rect x="340" y="118" width="24" height="52" rx="8"/>
    <!-- bottom -->
    <rect x="172" y="342" width="24" height="52" rx="8"/>
    <rect x="228" y="342" width="24" height="52" rx="8"/>
    <rect x="284" y="342" width="24" height="52" rx="8"/>
    <rect x="340" y="342" width="24" height="52" rx="8"/>
    <!-- left -->
    <rect x="118" y="172" width="52" height="24" rx="8"/>
    <rect x="118" y="228" width="52" height="24" rx="8"/>
    <rect x="118" y="284" width="52" height="24" rx="8"/>
    <rect x="118" y="340" width="52" height="24" rx="8"/>
    <!-- right -->
    <rect x="342" y="172" width="52" height="24" rx="8"/>
    <rect x="342" y="228" width="52" height="24" rx="8"/>
    <rect x="342" y="284" width="52" height="24" rx="8"/>
    <rect x="342" y="340" width="52" height="24" rx="8"/>
  </g>

  <!-- Chip body -->
  <rect x="152" y="152" width="208" height="208" rx="28" fill="#1e1b4b"/>
  <rect x="152" y="152" width="208" height="208" rx="28" fill="none" stroke="#a5b4fc" stroke-width="8"/>

  <!-- Die -->
  <rect x="210" y="210" width="92" height="92" rx="14" fill="url(#die)"/>

  <!-- Pin-1 dot -->
  <circle cx="190" cy="190" r="11" fill="#c7d2fe"/>
</svg>
